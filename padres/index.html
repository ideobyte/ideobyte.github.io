<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/data/favicon/padres/favicon-96x96.png" sizes="96x96">
<link rel="shortcut icon" href="/data/favicon/padres/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/data/favicon/padres/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ideo.zip">
<link rel="manifest" href="/data/favicon/padres/site.webmanifest">
<title>Padres Dashboard</title>

<!-- Preconnect to the API host so the first fetch isn't paying for DNS+TLS handshake -->
<link rel="preconnect" href="https://statsapi.mlb.com" crossorigin>

<style>
  @font-face {
    font-family: 'RTDyansBasic';
    src: url('/fonts/RTDyansBasic-ascii.woff2') format('woff2'); /* printable ASCII only */
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  /* Latin subsets from Google Fonts; licences are next to the files */
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('/fonts/BarlowCondensed-800-latin.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Bebas Neue';
    src: url('/fonts/BebasNeue-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/fonts/IBMPlexMono-400-latin.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('/fonts/IBMPlexMono-700-latin.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --brown: #2D1A0E;
    --brown-mid: #4A2C17;
    --gold: #C8922A;
    --gold-bright: #E8B84B;
    --gold-pale: #F5D98A;
    --gold-muted: rgba(232,184,75,0.8); /* small tags; dimmer is unreadable on the panels */
    --cream: #F5EDD8;
    --cream-muted: rgba(245,237,216,0.65);
    --yes: #7EB648;
    --yes-text: #84BC4F; /* --yes is just too dark for text on its own tint */
    --no: #C0392B;
    --no-text: #EF8F80; /* --no is too dark for text on the panels */
    --live: #E8B84B;
    --gold-line-strong: rgba(200,146,42,0.3);
    --gold-line-mid:    rgba(200,146,42,0.25);
    --gold-line-soft:   rgba(200,146,42,0.2);
    --gold-line-faint:  rgba(200,146,42,0.15);
    --gold-line-ghost:  rgba(200,146,42,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 150%; }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  body {
    background: var(--brown);
    color: var(--cream);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.67rem 1.33rem;
    position: relative;
    overflow-x: hidden;
  }

  /* Background decorations are non-interactive overlays */
  body::before, body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
  }
  body::before {
    background: repeating-linear-gradient(-50deg, transparent, transparent 55px, rgba(200,146,42,0.06) 55px, rgba(200,146,42,0.06) 57px);
  }
  body::after {
    background: radial-gradient(ellipse at 50% 0%, rgba(200,146,42,0.1) 0%, transparent 60%);
  }

  /* ── Shared corner decorations ───────────────────────────────────
     The original had three different class names (.panel-corner, .gpc,
     .card-corner) doing the exact same thing. Unified. */
  .corner {
    position: absolute;
    width: 0.53rem;
    height: 0.53rem;
    border-color: var(--gold-bright);
    border-style: solid;
  }
  .corner.tl { top: .31rem;    left: .31rem;   border-width: 1.5px 0 0 1.5px; }
  .corner.tr { top: .31rem;    right: .31rem;  border-width: 1.5px 1.5px 0 0; }
  .corner.bl { bottom: .31rem; left: .31rem;   border-width: 0 0 1.5px 1.5px; }
  .corner.br { bottom: .31rem; right: .31rem;  border-width: 0 1.5px 1.5px 0; }

  /* ── Header ────────────────────────────────────────────────── */
  .header {
    text-align: center;
    margin-bottom: 1.6rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.4s ease both;
  }
  .header-eyebrow { font-family: 'RTDyansBasic', sans-serif; font-size: 0.8rem; letter-spacing: 0.2rem; color: var(--gold-bright); margin-bottom: 0.18rem; }
  .header-title   { font-family: 'Bebas Neue', sans-serif; font-size: 2.27rem; letter-spacing: 0.33rem; line-height: 1; color: var(--cream); }
  .header-date    { font-size: 0.49rem; letter-spacing: 0.2rem; color: var(--cream-muted); margin-top: 0.44rem; }
  .header-divider { width: 2.67rem; height: 2px; background: var(--gold); margin: 0.62rem auto 0; }

  /* ── Top bar ────────────────────────────────────────────────── */
  .top-bar {
    width: 100%;
    max-width: 73.33rem;
    display: flex;
    align-items: center;
    padding-bottom: 0.6rem;
    position: relative;
    z-index: 10;
  }
  .home-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    background: none;
    border: 1px solid rgba(200,146,42,0.4);
    color: var(--gold-bright);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.4rem;
    letter-spacing: 0.15rem;
    padding: 0.35rem 0.65rem;
    border-radius: 3px;
    text-decoration: none;
    text-transform: uppercase;
    transition: background-color 0.2s, border-color 0.2s;
  }
  .home-btn:hover {
    background: rgba(200,146,42,0.1);
    border-color: var(--gold-bright);
  }

  /* ── Bottom row (game panel + standings) ───────────────────── */
  .bottom-row {
    display: flex;
    align-items: stretch;
    gap: 1rem;
    width: 100%;
    max-width: 73.33rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease 0.2s both;
    justify-content: center;
  }
  .bottom-left, .bottom-right {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }
  .bottom-left { flex-shrink: 0; }
  .bottom-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.6rem;
    letter-spacing: 0.4rem;
    color: var(--gold-bright);
    white-space: nowrap;
    margin-bottom: 0.6rem;
    text-align: center;
    text-transform: uppercase;
  }

  /* ── Promo grid ────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.71rem;
    width: 100%;
    max-width: 73.33rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease 0.1s both;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(1.07rem); } to { opacity: 1; transform: translateY(0); } }

  .matchup-line {
    font-size: 0.44rem;
    letter-spacing: 0.09rem;
    color: var(--cream-muted);
    margin-top: 0.4rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .matchup-line .matchup-live { color: var(--gold-bright); }

  .promo-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.25rem;
    color: var(--gold-bright);
    text-align: center;
    width: 100%;
    max-width: 73.33rem;
    position: relative;
    z-index: 1;
    margin: 1.4rem 0 0.8rem;
    animation: fadeUp 0.5s ease 0.15s both;
  }

  /* ── NL West panel + standings ─────────────────────────────── */
  .nlwest-panel {
    width: 100%;
    background: var(--brown-mid);
    border: 2px solid var(--gold);
    border-radius: 6px;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s ease 0.25s both;
    margin-bottom: 1.6rem;
    flex: 1;
    overflow: hidden;
  }

  /* When showing stats, panel has a fixed height set by JS */
  .nlwest-panel.stats-open {
    flex: none;
    overflow: hidden;
  }

  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table thead tr { border-bottom: 1px solid var(--gold-line-strong); }
  .standings-table th {
    font-size: 0.5rem;
    letter-spacing: 0.15rem;
    color: var(--cream-muted);
    text-transform: uppercase;
    padding: 0.35rem 0.8rem;
    text-align: left;
    font-weight: 400;
    border-right: 1px solid var(--gold-line-mid);
  }
  .standings-table th:last-child { border-right: none; }
  .standings-table th.num { text-align: center; }
  .standings-table tbody tr {
    border-bottom: 1px solid var(--gold-line-ghost);
    transition: background-color 0.15s;
    cursor: pointer;
  }
  .standings-table tbody tr:last-child { border-bottom: none; }
  .standings-table tbody tr:hover { background: rgba(200,146,42,0.05); }
  .standings-table tbody tr.padres-row { background: rgba(200,146,42,0.07); }
  .standings-table td {
    padding: 0.3rem 0.8rem;
    vertical-align: middle;
    border-right: 1px solid var(--gold-line-faint);
  }
  .standings-table td:last-child { border-right: none; }
  .standings-table td.num { text-align: center; }

  .team-name-cell {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: none;
    border: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .team-abbr      { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 0.05rem; color: var(--cream); min-width: 2.2rem; }
  .team-abbr.padres { color: var(--gold-bright); }
  .team-full { font-size: 0.62rem; color: var(--cream); letter-spacing: 0.03rem; white-space: nowrap; }
  .record, .gb, .pct { font-size: 0.65rem; color: var(--cream); }

  .next-game-cell { text-align: right; width: 28%; padding: 0.3rem 1.4rem 0.3rem 0; }
  .next-game-th   { font-size: 0.5rem; letter-spacing: 0.2rem; color: var(--cream-muted); font-weight: 400; text-transform: uppercase; }
  .game-live { display: inline-flex; align-items: center; gap: 0.3rem; }
  .live-dot {
    display: inline-block;
    width: 0.31rem;
    height: 0.31rem;
    background: var(--live);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%      { opacity: .35; transform: scale(.65); }
  }

  /* Score line: ABB R – R ABB */
  .game-scoreline { font-family: 'Bebas Neue', sans-serif; font-size: 0.72rem; color: var(--gold-bright); letter-spacing: 0.06rem; }
  /* Replaces inline style="color:..." per cell */
  .score-team-won  { color: var(--cream); }
  .score-team-lost { color: var(--no-text); }
  .score-dash      { color: var(--cream-muted); }

  .game-sub  { font-size: 0.5rem;  color: rgba(245,237,216,0.75); letter-spacing: 0.04rem; margin-top: 0.1rem; }
  .game-time { font-size: 0.56rem; color: var(--cream); letter-spacing: 0.04rem; }
  .no-game   { font-size: 0.38rem; color: rgba(245,237,216,0.6); letter-spacing: 0.04rem; }
  .game-off  { color: rgba(245,237,216,0.6); }
  .game-entry + .game-entry { margin-top: 0.25rem; }

  /* ── Promo cards ───────────────────────────────────────────── */
  .card {
    background: var(--brown-mid);
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 0.82rem 1.07rem 0.72rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    gap: 0.35rem;
  }
  .card-brand-block   { display: flex; flex-direction: column; align-items: center; gap: 0.12rem; }
  .card-icon          { font-size: 1.3rem; line-height: 1; }
  .card-brand         { font-family: 'Bebas Neue', sans-serif; font-size: 0.7rem; letter-spacing: 0.18rem; color: var(--gold-bright); }
  .card-trigger-label { font-size: 0.4rem; letter-spacing: 0.2rem; color: var(--cream-muted); text-transform: uppercase; }
  .card-trigger       { font-family: 'Bebas Neue', sans-serif; font-size: 0.89rem; letter-spacing: 0.09rem; color: var(--cream); line-height: 1.2; }
  .card-divider       { width: 100%; height: 1px; background: var(--gold-line-soft); }

  .result-area {
    width: 100%;
    padding: 0.53rem 0.62rem;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .result-area.yes     { background: rgba(126,182,72,0.12); border: 1px solid var(--yes); }
  .result-area.no      { background: rgba(192,57,43,0.12);  border: 1px solid var(--no); }
  .result-area.live    { background: rgba(232,184,75,0.08); border: 1px solid var(--live); }
  .result-area.nogame  { background: rgba(200,146,42,0.08); border: 1px solid var(--gold); }
  .result-area.loading { background: transparent;            border: 1px solid var(--gold-line-soft); }

  .result-stat        { font-family: 'Bebas Neue', sans-serif; font-size: 1.65rem; line-height: 1; color: var(--gold-bright); }
  .result-stat-label  { font-size: 0.4rem; letter-spacing: 0.2rem; color: var(--cream-muted); text-transform: uppercase; }
  .result-game-label  { font-family: 'Bebas Neue', sans-serif; font-size: 1.65rem; line-height: 1; color: var(--gold-bright); word-break: break-word; }
  .result-verdict     { font-family: 'Bebas Neue', sans-serif; font-size: 0.88rem; letter-spacing: 0.09rem; line-height: 1; }
  .result-verdict.yes    { color: var(--yes-text); }
  .result-verdict.no     { color: var(--no-text); }
  .result-verdict.live   { color: var(--live); font-size: 0.65rem; }
  .result-verdict.nogame { color: var(--gold-pale); font-size: 0.53rem; }
  .result-verdict .live-dot {
    margin-right: .22rem;
    vertical-align: middle;
    position: relative;
    top: -.04rem;
  }

  .result-sub      { font-size: 0.44rem; letter-spacing: 0.07rem; color: var(--cream-muted); }
  .result-sub span { color: var(--cream); font-weight: 700; }
  .card-reward     { font-size: 0.44rem; letter-spacing: 0.04rem; color: var(--cream-muted); line-height: 1.3; }
  .card-reward a   { color: var(--gold-bright); text-decoration: none; }
  .card-reward a:hover { text-decoration: underline; }

  .loading-blink {
    font-size: 0.53rem;
    letter-spacing: 0.2rem;
    color: var(--gold-bright);
    animation: blink 0.9s step-end infinite;
    padding: 0.35rem 0;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Game Panel ────────────────────────────────────────────── */
  .game-panel {
    background: var(--brown-mid);
    border: 2px solid var(--gold);
    border-radius: 6px;
    padding: 0.5rem 1rem 0.9rem;
    position: relative;
    width: 100%;
    flex: 1;
    margin-bottom: 1.6rem;
    display: flex;
    flex-direction: column;
  }

  .gp-body { display: flex; gap: 0; align-items: stretch; flex: 1; }

  .gp-left, .gp-mid, .gp-right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .gp-left  { border-right: 1px solid var(--gold-line-soft); padding-right: 0.7rem; }
  .gp-mid   { align-items: center; padding: 0 0.6rem; }
  .gp-right { border-left:  1px solid var(--gold-line-soft); padding-left:  0.7rem; text-align: right; }

  .gp-lineup { list-style: none; flex: 0; }
  .gp-lineup li {
    font-size: 0.6rem;
    line-height: 1.7;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gp-lineup li.current-batter { color: var(--gold-bright); font-weight: 700; }
  .gp-lineup li .order-num { color: var(--gold-muted); font-size: 0.45rem; margin-right: 0.2rem; }
  .gp-right .gp-lineup li .order-num { margin-right: 0; margin-left: 0.2rem; }
  .gp-lineup li .pos-tag { font-size: 0.4rem; color: var(--gold-muted); margin-left: 0.2rem; }
  .gp-lineup li .sub-mark { font-size: 0.38rem; color: var(--yes); margin-left: 0.15rem; vertical-align: super; }
  .pos-tag { font-family: 'IBM Plex Mono', monospace; font-size: 0.4rem; color: var(--gold-muted); }

  .gp-inning-block { text-align: center; margin-bottom: 0.3rem; }
  .gp-inning-num   { font-family: 'Bebas Neue', sans-serif; font-size: 1.0rem; color: var(--cream); line-height: 1; letter-spacing: 0.05rem; }
  .gp-inning-word  { font-size: 0.38rem; letter-spacing: 0.18rem; color: var(--cream-muted); text-transform: uppercase; }

  .gp-live-badge,
  .gp-warmup-badge {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    font-size: 0.38rem;
    letter-spacing: 0.12rem;
    margin-bottom: 0.1rem;
    justify-content: center;
  }
  .gp-live-badge   { color: var(--gold-bright); }
  .gp-warmup-badge { color: var(--cream-muted); }

  .gp-diamond { flex-shrink: 0; margin: 0; }
  .gp-diamond svg { display: block; }

  .gp-outs-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    margin-top: -0.9rem;
    margin-bottom: 0.35rem;
  }
  .gp-outs-label { font-size: 0.38rem; letter-spacing: 0.18rem; color: var(--cream-muted); text-transform: uppercase; padding-left: 0.3rem; }
  .outs-pips { display: flex; gap: 0.25rem; }
  .out-pip {
    width: 0.55rem;
    height: 0.55rem;
    border-radius: 50%;
    border: 1.5px solid rgba(200,146,42,0.75);
    background: transparent;
    transition: background-color 0.2s;
  }
  .out-pip.on { background: var(--no); border-color: var(--no); box-shadow: 0 0 0 1.5px #000; }

  .gp-center-score {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
    margin-top: 0.15rem;
  }
  .gp-center-team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.05rem;
    line-height: 1;
  }
  .gp-center-team.padres { color: var(--gold-bright); }
  .gp-center-team.opp    { color: var(--cream); }
  .gp-center-runs {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    color: var(--cream);
    line-height: 1;
  }
  .gp-center-dash { color: var(--cream-muted); font-size: 1rem; position: relative; top: -0.25rem; }

  .gp-lineup-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.12rem;
    margin-bottom: 0.05rem;
  }
  .gp-lineup-name.padres { color: var(--gold-bright); }
  .gp-lineup-name.opp    { color: var(--cream); }
  .gp-right .gp-lineup-name { text-align: right; }

  .gp-inning-block-mid { display: flex; flex-direction: column; align-items: center; margin-top: 0.1rem; }
  .gp-half-arrow-sm    { font-size: 0.55rem; color: var(--gold-bright); line-height: 1; }
  .gp-inning-big       { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--cream); line-height: 1; letter-spacing: 0.05rem; }
  .gp-count-big        { font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; color: var(--gold-bright); line-height: 1.2; letter-spacing: 0.05rem; }
  .gp-last-pitch       { font-size: 0.5rem; color: var(--gold-pale); text-align: center; letter-spacing: 0.03rem; margin-top: 0.15rem; max-width: 9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
  .gp-thread-link      { margin-top: 0.25rem; }

<body>

<script>
'use strict';

/* ── Constants ────────────────────────────────────────────────── */
const PADRES_ID = 135;
const STATS_API = 'https://statsapi.mlb.com/api/v1';
const STATS_API_V11 = 'https://statsapi.mlb.com/api/v1.1';
const GAME_POLL_MS = 15_000;            /* game in progress */
const PREGAME_POLL_MS = 30_000;         /* first pitch is close, or retrying after an error */
const PREGAME_WINDOW_MS = 30 * 60_000;  /* how long before first pitch counts as close */
const IDLE_POLL_MS = 5 * 60_000;        /* nothing happening soon */
const FETCH_TIMEOUT_MS = 20_000;
const STANDINGS_POLL_MS = 30_000;
const LATE_GAME_MS = 12 * 60 * 60_000;  /* a game that started this recently may have only just ended */
/* Regular season + Wild Card, Division Series, LCS, World Series */
const GAME_TYPES = 'R,F,D,L,W';
/* Reddit blocks cross-origin API calls, so link to its search instead. */
const GAME_THREAD_URL = 'https://www.reddit.com/r/Padres/search/?q=title%3A%22Game+Thread%22&restrict_sr=1&sort=new';

/* NL West — stable MLB team IDs + abbreviations */
const NL_WEST = [
  { id: 119, abbr: 'LAD', name: 'Los Angeles Dodgers'  },
  { id: 135, abbr: 'SD',  name: 'San Diego Padres'     },
  { id: 109, abbr: 'AZ',  name: 'Arizona Diamondbacks' },
  { id: 137, abbr: 'SF',  name: 'San Francisco Giants' },
  { id: 115, abbr: 'COL', name: 'Colorado Rockies'     },
];
const NL_WEST_IDS = NL_WEST.map(t => t.id);

/* Team ID → abbreviation (schedule responses don't include abbreviations). */
const ID_TO_ABBR = {
  108: 'LAA', 109: 'AZ',  110: 'BAL', 111: 'BOS', 112: 'CHC',
  113: 'CIN', 114: 'CLE', 115: 'COL', 116: 'DET', 117: 'HOU',
  118: 'KC',  119: 'LAD', 120: 'WSH', 121: 'NYM', 133: 'ATH',
  134: 'PIT', 135: 'SD',  136: 'SEA', 137: 'SF',  138: 'STL',
  139: 'TB',  140: 'TEX', 141: 'TOR', 142: 'MIN', 143: 'PHI',
  144: 'ATL', 145: 'CWS', 146: 'MIA', 147: 'NYY', 158: 'MIL',
};

/* Reusable corner decoration markup (4 corners on every panel/card). */
const CORNERS_HTML = '<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const NAME_SUFFIXES = new Set(['jr.', 'sr.', 'ii', 'iii', 'iv', 'v']);

/* Captured before any data goes in, to restore it after the stats panel closes. */
const STANDINGS_TABLE_HTML = document.querySelector('.standings-table').outerHTML;

/* ── Promo definitions ────────────────────────────────────────── */
const PROMOS = [
  {
    id: 'strikeouts', icon: '🐾', brand: 'Petco',
    trigger: 'K-9 or more strikeouts',
    reward: '25% off your total purchase at participating Petco locations with loyalty membership. Ask for "Padres K-9 Promotion" at checkout.',
    rewardLink: { text: 'Petco.com/PadresK9', href: 'https://www.petco.com/PadresK-9' },
    stat: (box, side) => {
      const ps = box.teams[side].teamStats?.pitching;
      if (ps?.strikeOuts !== undefined) return { value: ps.strikeOuts, label: 'Strikeouts' };
      const pitchers = box.teams[side].pitchers || [];
      const players = box.teams[side].players;
      let k = 0;
      for (const pid of pitchers) k += players[`ID${pid}`]?.stats?.pitching?.strikeOuts ?? 0;
      return { value: k, label: 'Strikeouts' };
    },
    check: v => v >= 9,
    liveMsg: v => v >= 9 ? 'Already achieved' : `Need ${9 - v} more`,
  },
  {
    id: 'homerun', icon: '🍔', brand: 'Jack in the Box',
    trigger: 'Any Padres home run',
    reward: 'Free Jumbo Jack with large drink purchase the day after. San Diego Jack in the Box locations or Jack App with code GOPADRES26.',
    stat: (box, side) => {
      const batters = box.teams[side].batters || [];
      const players = box.teams[side].players;
      let hrs = 0;
      for (const pid of batters) hrs += players[`ID${pid}`]?.stats?.batting?.homeRuns ?? 0;
      return { value: hrs, label: 'Home Runs' };
    },
    check: v => v >= 1,
    liveMsg: v => v >= 1 ? 'Already hit one!' : 'None yet',
  },
  {
    id: 'win', icon: '🍟', brand: "McDonald's",
    trigger: 'Padres win',
    reward: "Free medium fries with $2 purchase the day after a Padres win. Only on the app at participating McDonald's locations.",
    stat: (box, side, isWin) => ({ value: isWin ? 1 : 0, label: isWin ? 'Win' : 'Loss' }),
    check: v => v === 1,
    liveMsg: (v, score) => score.padres > score.opp ? 'Currently winning' : score.padres < score.opp ? 'Currently losing' : 'Tied',
    isWinCard: true,
  },
  {
    id: 'stolenbase', icon: '🛵', brand: 'Uber Eats',
    trigger: 'Any Padres stolen base',
    reward: 'Look out for a special Uber Eats code for a deal on contactless delivery for restaurant takeout, groceries and more.',
    stat: (box, side) => {
      const bs = box.teams[side].teamStats?.batting;
      if (bs?.stolenBases !== undefined) return { value: bs.stolenBases, label: 'Stolen Bases' };
      const batters = box.teams[side].batters || [];
      const players = box.teams[side].players;
      let sb = 0;
      for (const pid of batters) sb += players[`ID${pid}`]?.stats?.batting?.stolenBases ?? 0;
      return { value: sb, label: 'Stolen Bases' };
    },
    check: v => v >= 1,
    liveMsg: v => v >= 1 ? 'Already stolen one!' : 'None yet',
  },
];

/* ── Helpers ──────────────────────────────────────────────────── */
const _ptDateFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Los_Angeles' });

function getLocalDateStr(offset = 0) {
  return _ptDateFmt.format(new Date(Date.now() + offset * 86_400_000));
}

function formatDisplayDate(s) {
  const [y, m, day] = s.split('-');
  return `${MONTHS[parseInt(m, 10) - 1]} ${parseInt(day, 10)}, ${y}`;
}

/* Returns last name, respecting Jr./Sr./II/III/IV suffixes. */
function lastName(fullName) {
  if (!fullName) return '—';
  const parts = fullName.split(' ');
  if (parts.length >= 3 && NAME_SUFFIXES.has(parts[parts.length - 1].toLowerCase())) {
    return parts[parts.length - 2] + ' ' + parts[parts.length - 1];
  }
  return parts[parts.length - 1];
}

function formatGameTime(g) {
  return g.status.startTimeTBD
    ? 'Time TBD'
    : new Date(g.gameDate).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

const ordinalSuffix = n => [, 'st', 'nd', 'rd'][n] || 'th';

async function fetchJSON(url) {
  const res = await fetch(url, { signal: AbortSignal.timeout(FETCH_TIMEOUT_MS) });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

/* ── Card rendering ───────────────────────────────────────────── */
function cardHTML(promo, state) {
  let resultHTML;

  if (state.status === 'loading') {
    resultHTML = '<div class="result-area loading"><div class="loading-blink">Loading ▋</div></div>';
  } else if (state.status === 'error') {
    resultHTML = '<div class="result-area nogame"><div class="result-verdict nogame">Unavailable</div><div class="result-sub">Could not load the game — retrying</div></div>';
  } else if (state.status === 'postseason') {
    resultHTML = '<div class="result-area nogame"><div class="result-verdict nogame">Postseason</div><div class="result-sub">Promos only tracked in the regular season</div></div>';
  } else if (state.status === 'nogame') {
    resultHTML = `<div class="result-area nogame"><div class="result-verdict nogame">No game</div><div class="result-sub">${state.reason ?? 'Padres had the day off'}</div></div>`;
  } else {
    const achieved = promo.check(state.value, state);
    const cls = state.status === 'live' ? 'live' : (achieved ? 'yes' : 'no');
    let verdictText, subText, topContent;

    if (state.status === 'live') {
      verdictText = promo.isWinCard
        ? promo.liveMsg(state.value, state.score)
        : (achieved ? 'Yes ✓' : 'In Progress');
      subText = `<span>${promo.liveMsg ? promo.liveMsg(state.value, state.score) : ''}</span>${state.gameNote}`;
      topContent = promo.isWinCard
        ? `<div class="result-game-label">${state.score.padres > state.score.opp ? 'Padres Lead!' : state.score.padres < state.score.opp ? 'Padres Trail' : 'Tied Game'}</div>`
        : `<div class="result-stat">${state.value}</div><div class="result-stat-label">${state.label}</div>`;
    } else {
      verdictText = achieved ? 'Yes ✓' : 'No ✗';
      subText = achieved ? `<span>Promo active today!</span>${state.gameNote}` : '<span>No promo today</span>';
      topContent = promo.isWinCard
        ? `<div class="result-game-label">${achieved ? 'Padres Won!' : 'Padres Lost :('}</div><div class="result-stat-label">${achieved ? 'Free Fries! 🍟' : 'No Free Fries for You'}</div>`
        : `<div class="result-stat">${state.value}</div><div class="result-stat-label">${state.label}</div>`;
    }

    const liveDot = state.status === 'live' ? '<span class="live-dot"></span>' : '';
    resultHTML = `<div class="result-area ${cls}">${topContent}<div class="result-verdict ${cls}">${liveDot}${verdictText}</div><div class="result-sub">${subText}</div></div>`;
  }

  const rewardLink = promo.rewardLink
    ? ` <a href="${promo.rewardLink.href}" target="_blank" rel="noopener">${promo.rewardLink.text}</a>`
    : '';

  return `<div class="card">${CORNERS_HTML}<div class="card-brand-block"><div class="card-icon">${promo.icon}</div><div class="card-brand">${promo.brand}</div></div><div class="card-trigger-label">Promo triggers on</div><div class="card-trigger">${promo.trigger}</div><div class="card-divider"></div>${resultHTML}<div class="card-reward">${promo.reward}${rewardLink}</div></div>`;
}

let _cardsHTML = '';

function renderAllCards(stateForPromo) {
  const html = PROMOS.map(p => cardHTML(p, stateForPromo(p))).join('');
  if (html === _cardsHTML) return;
  _cardsHTML = html;
  /* Redrawing drops keyboard focus, so put it back on the same link. */
  const focusedLink = [...$.grid.querySelectorAll('a')].indexOf(document.activeElement);
  $.grid.innerHTML = html;
  $.grid.querySelectorAll('a')[focusedLink]?.focus({ preventScroll: true });
}

/* ── Standings ────────────────────────────────────────────────── */
let _season = null; /* season shown in the standings and stats panels */

/* Win-loss records keyed by team ID. */
async function fetchRecords(season) {
  const data = await fetchJSON(`${STATS_API}/standings?leagueId=104&season=${season}&standingsTypes=regularSeason&fields=records,teamRecords,team,id,wins,losses,divisionRank,divisionGamesBack,streak,streakCode,splitRecords,type`);
  const records = {};
  for (const tr of (data.records ?? []).flatMap(r => r.teamRecords ?? [])) {
    const l10 = tr.records?.splitRecords?.find(s => s.type === 'lastTen');
    records[tr.team.id] = {
      w: tr.wins,
      l: tr.losses,
      rank: Number(tr.divisionRank),
      gb: parseFloat(tr.divisionGamesBack) || 0, /* "-" for the leader */
      l10w: l10?.wins ?? '-',
      l10l: l10?.losses ?? '-',
      streak: tr.streak?.streakCode ?? '',
    };
  }
  return records;
}

/* Yesterday's and today's games involving NL West teams, in start order. */
async function fetchDivisionGames(yesterdayStr, todayStr) {
  const data = await fetchJSON(`${STATS_API}/schedule?sportId=1&startDate=${yesterdayStr}&endDate=${todayStr}&teamId=${NL_WEST_IDS}&gameType=${GAME_TYPES}&hydrate=linescore&fields=dates,date,games,gamePk,gameDate,rescheduleGameDate,resumeGameDate,status,abstractGameState,detailedState,startTimeTBD,teams,home,away,team,id,score,linescore,currentInning,inningHalf,runs`);
  const gamesOn = date => (data.dates ?? [])
    .filter(d => d.date === date)
    .flatMap(d => d.games ?? [])
    /* Verify the game actually falls on that day in PT. */
    .filter(g => _ptDateFmt.format(new Date(g.gameDate)) === date)
    .sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));
  return { yesterday: gamesOn(yesterdayStr), today: gamesOn(todayStr) };
}

/* Draws the standings and returns yesterday's and today's division games. */
async function fetchNLWest() {
  const todayStr = getLocalDateStr(0);
  let season = Number(todayStr.slice(0, 4));
  let [records, games] = await Promise.all([fetchRecords(season), fetchDivisionGames(getLocalDateStr(-1), todayStr)]);

  /* Until Opening Day, keep showing how last season ended. */
  if (!games.today.length && NL_WEST_IDS.every(id => !records[id]?.w && !records[id]?.l)) {
    season--;
    records = await fetchRecords(season);
  }

  if (!$.standingsBody) return games; /* stats panel was opened meanwhile */
  _season = season;

  const noRecord = { w: 0, l: 0, rank: 99, gb: 0, l10w: '-', l10l: '-', streak: '' };
  const rows = NL_WEST
    .map(team => ({ ...team, rec: records[team.id] ?? noRecord }))
    .sort((a, b) => a.rec.rank - b.rec.rank);

  const html = rows.map(({ id, abbr, name, rec }) => {
    const isPadres   = id === PADRES_ID;
    const totalGames = rec.w + rec.l;
    const pct = totalGames > 0 ? (rec.w / totalGames).toFixed(3).replace(/^0/, '') : '.000';
    const streakClass = rec.streak.startsWith('W') ? 'streak-w' : rec.streak.startsWith('L') ? 'streak-l' : '';
    const teamGames = games.today.filter(g => g.teams.home.team.id === id || g.teams.away.team.id === id);

    return `<tr class="${isPadres ? 'padres-row' : ''}" data-team-id="${id}" onclick="openTeamStats(${id}, '${name}', ${isPadres})">
      <td>
        <button class="team-name-cell" aria-label="${name} stats">
          <span class="team-abbr ${isPadres ? 'padres' : ''}">${abbr}</span>
          <span class="team-full">${name}</span>
        </button>
      </td>
      <td class="num"><div class="record">${rec.w}</div></td>
      <td class="num"><div class="record">${rec.l}</div></td>
      <td class="num"><div class="pct">${pct}</div></td>
      <td class="num hide-mobile"><div class="gb">${rec.gb || '—'}</div></td>
      <td class="num"><div class="record">${rec.l10w}-${rec.l10l}</div></td>
      <td class="num hide-mobile"><div class="record ${streakClass}">${rec.streak || '—'}</div></td>
      <td class="next-game-cell">${buildGameCell(teamGames, id)}</td>
    </tr>`;
  }).join('');

  /* Redrawing drops keyboard focus, so put it back on the same team. */
  const focusedId = document.activeElement?.closest('#standingsBody tr')?.dataset.teamId;
  $.standingsBody.innerHTML = html;
  if (focusedId) focusStandingsTeam(focusedId);
  return games;
}

function focusStandingsTeam(teamId) {
  document.querySelector(`#standingsBody tr[data-team-id="${teamId}"] button`)?.focus({ preventScroll: true });
}

/* One block per game, so both halves of a doubleheader show. */
function buildGameCell(games, teamId) {
  if (!games.length) return '<div class="no-game">Off day</div>';
  return games.map((g, i) => {
    const gameLabel = games.length > 1 ? `Gm ${i + 1} · ` : '';
    return `<div class="game-entry">${buildGameEntry(g, teamId, gameLabel)}</div>`;
  }).join('');
}

function buildGameEntry(g, teamId, gameLabel) {
  const { home, away } = g.teams;
  const isHome  = home.team.id === teamId;
  const me      = isHome ? home : away;
  const opp     = isHome ? away : home;
  const myAbbr  = ID_TO_ABBR[me.team.id]  ?? '???';
  const oppAbbr = ID_TO_ABBR[opp.team.id] ?? '???';
  const myRuns  = me.score  ?? g.linescore?.teams?.[isHome ? 'home' : 'away']?.runs ?? 0;
  const oppRuns = opp.score ?? g.linescore?.teams?.[isHome ? 'away' : 'home']?.runs ?? 0;
  const state   = g.status.abstractGameState;
  const detail  = (g.status.detailedState ?? '').toLowerCase();

  const notPlaying = isSuspended(g) ? 'Suspended'
    : detail.includes('postponed')  ? 'Postponed'
    : detail.includes('cancel')     ? 'Cancelled'
    : null;
  if (notPlaying) {
    const newDate = isSuspended(g) ? g.resumeGameDate : g.rescheduleGameDate;
    const sub = [];
    if (isSuspended(g)) sub.push(`${myAbbr} ${myRuns} – ${oppRuns} ${oppAbbr}`);
    if (newDate) {
      const [, mm, dd] = newDate.split('-');
      sub.push(`→ ${MONTHS[parseInt(mm, 10) - 1]} ${parseInt(dd, 10)}`);
    }
    return `<div class="game-time game-off">${notPlaying}</div>${sub.length ? `<div class="game-sub">${gameLabel}${sub.join(' ')}</div>` : ''}`;
  }

  if (state === 'Live') {
    const inning = g.linescore?.currentInning ?? null;
    const half   = g.linescore?.inningHalf ?? null;
    const isWarmup = detail.includes('warm')
                  || (!inning && !half)
                  || (inning === 1 && !half);
    const inningStr = isWarmup
      ? 'Warming Up'
      : inning ? `${half ?? ''} ${inning}${ordinalSuffix(inning)}` : 'Live';
    const scoreStr = isWarmup
      ? `${myAbbr} – ${oppAbbr}`
      : `${myAbbr} ${myRuns} – ${oppRuns} ${oppAbbr}`;
    return `<div class="game-live"><span class="live-dot"></span><span class="game-scoreline">${scoreStr}</span></div><div class="game-sub">${gameLabel}${inningStr}</div>`;
  }

  if (state === 'Final' || detail.includes('final') || detail.includes('completed')) {
    const won = myRuns > oppRuns;
    const myCls  = won ? 'score-team-won'  : 'score-team-lost';
    const oppCls = won ? 'score-team-lost' : 'score-team-won';
    return `<div class="game-scoreline">
      <span class="${myCls}">${myAbbr} ${myRuns}</span><span class="score-dash"> – </span><span class="${oppCls}">${oppRuns} ${oppAbbr}</span>
    </div><div class="game-sub">${gameLabel}Final</div>`;
  }

  return `<div class="game-time">${formatGameTime(g)}</div><div class="game-sub">${gameLabel}${isHome ? 'vs' : '@'} ${oppAbbr}</div>`;
}

/* ── Padres game panel ────────────────────────────────────────── */
function buildLineupEntry(p, pid, i) {
  const name = p?.person?.fullName ?? `Player ${pid}`;
  const pos  = p?.position?.abbreviation ?? p?.allPositions?.[0]?.abbreviation ?? '';
  const isSub = p?.gameStatus?.isSubstitute ?? false;
  return { num: i + 1, name, last: lastName(name), pos, id: pid, isSub };
}

function getLineup(feedTeam) {
  const players = feedTeam?.players ?? {};
  const order   = feedTeam?.battingOrder ?? [];
  const ids     = order.length ? order : feedTeam?.batters ?? []; /* order is empty until lineups are set */
  return ids.slice(0, 9).map((pid, i) => buildLineupEntry(players[`ID${pid}`], pid, i));
}

/* Find the most recent pitcher with stats and return name + pitch count. */
function getActivePitcherInfo(feedTeam) {
  const pitchers = feedTeam?.pitchers ?? [];
  const players  = feedTeam?.players ?? {};
  for (let i = pitchers.length - 1; i >= 0; i--) {
    const p = players[`ID${pitchers[i]}`];
    if (p?.stats?.pitching) {
      const s = p.stats.pitching;
      return {
        name:  p.person?.fullName ?? '—',
        count: s.pitchesThrown ?? s.numberOfPitches ?? null,
      };
    }
  }
  return { name: '—', count: null };
}

function diamondSVG(first, second, third) {
  const pad = 14, size = 80, bs = 26, cx = size / 2;
  const top   = { x: cx,              y: bs / 2 + 1 };
  const right = { x: size - bs / 2 - 1, y: cx };
  const left  = { x: bs / 2 + 1,        y: cx };
  const dim = 'rgba(200,146,42,0.7)', lit = '#E8B84B';
  const totalW = size + pad * 2, totalH = size + pad * 2;

  const baseRect = (px, py, on) => {
    const ox = px + pad, oy = py + pad;
    return `<rect x="${ox - bs / 2}" y="${oy - bs / 2}" width="${bs}" height="${bs}" fill="${on ? lit : 'transparent'}" stroke="${on ? lit : dim}" stroke-width="2.5" transform="rotate(45 ${ox} ${oy})" rx="1"/>`;
  };

  return `<svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" xmlns="http://www.w3.org/2000/svg">${baseRect(right.x, right.y, first)}${baseRect(top.x, top.y, second)}${baseRect(left.x, left.y, third)}</svg>`;
}

/* The parts of the live feed that renderLiveGame reads (4 KB instead of 120 KB). */
const LIVE_FEED_FIELDS = [
  'gameData,teams,home,away,id,teamName',
  'liveData,linescore,currentInning,inningHalf,outs,runs,offense,first,second,third,batter,fullName',
  'plays,currentPlay,atBatIndex,matchup,pitcher,count,balls,strikes,about,isComplete,result,event,isOut',
  'runners,movement,end,details,runner,playEvents,isPitch,description',
  'boxscore,battingOrder,batters,pitchers,players,person,position,allPositions,abbreviation',
  'gameStatus,isSubstitute,stats,pitching,pitchesThrown,numberOfPitches',
].join(',');

async function renderLiveGame(liveGame) {
  const feed = await fetchJSON(`${STATS_API_V11}/game/${liveGame.gamePk}/feed/live?fields=${LIVE_FEED_FIELDS}`);

  const linescore = feed.liveData?.linescore ?? {};
  const play      = feed.liveData?.plays?.currentPlay ?? {};
  const matchup   = play.matchup ?? {};
  const offense   = linescore.offense ?? {};

  const detailedState = liveGame.status?.detailedState ?? '';
  const isWarmup =
       detailedState.toLowerCase().includes('warm')
    || (!play.atBatIndex && !play.matchup?.pitcher)
    || (linescore.currentInning === 1 && !feed.liveData?.plays?.currentPlay);

  const homeTeamId = feed.gameData?.teams?.home?.id;
  const awayId     = feed.gameData?.teams?.away?.id;
  const padresSide = homeTeamId === PADRES_ID ? 'home' : 'away';
  const oppSide    = padresSide === 'home' ? 'away' : 'home';
  const oppAbbr    = ID_TO_ABBR[padresSide === 'home' ? awayId : homeTeamId] ?? '???';

  const padresShortName = feed.gameData?.teams?.[padresSide]?.teamName ?? 'Padres';
  const oppShortName    = feed.gameData?.teams?.[oppSide]?.teamName    ?? oppAbbr;

  const homeRuns = linescore.teams?.home?.runs ?? 0;
  const awayRuns = linescore.teams?.away?.runs ?? 0;
  const padresRuns = padresSide === 'home' ? homeRuns : awayRuns;
  const oppRuns    = padresSide === 'home' ? awayRuns : homeRuns;

  const inning = linescore.currentInning ?? 1;
  const half   = linescore.inningHalf ?? 'Top';
  const outs   = linescore.outs ?? 0;
  const onFirst  = !!offense.first;
  const onSecond = !!offense.second;
  const onThird  = !!offense.third;

  const currentBatter     = matchup.batter ?? offense.batter;
  const currentBatterId   = currentBatter?.id ?? null;
  const currentBatterLast = lastName(currentBatter?.fullName);
  const batterCount = play.count ? `${play.count.balls}-${play.count.strikes}` : '';

  const lastPitchDesc = (() => {
    if (isWarmup) return '';
    const batterLast = currentBatterLast !== '—' ? currentBatterLast : '';

    const pitchPhrase = (desc, count) => {
      const d = desc.toLowerCase();
      if (d === 'ball' || d === 'intent ball' || d.includes('ball in dirt') || d.includes('pitchout'))
        return `takes ball ${count?.balls ?? ''}`.trim();
      if (d === 'called strike') return `takes strike ${count?.strikes ?? ''}`.trim();
      if (d.includes('in play'))         return 'Ball in play';
      if (d.includes('swinging strike') || d === 'missed bunt') return `swings and misses for strike ${count?.strikes ?? ''}`.trim();
      if (d.includes('foul tip'))  return `fouls it off for strike ${count?.strikes ?? ''}`.trim();
      if (d.includes('foul bunt')) return `fouls off the bunt for strike ${count?.strikes ?? ''}`.trim();
      if (d.includes('foul'))      return `fouls it off for strike ${count?.strikes ?? ''}`.trim();
      return desc;
    };

    const eventPhrase = event => {
      const e = event.toLowerCase();
      if (e === 'single')                                return 'singles';
      if (e === 'double')                                return 'doubles';
      if (e === 'triple')                                return 'triples';
      if (e.includes('home run'))                        return 'homers';
      if (e === 'strikeout double play')                 return 'strikes out into a double play';
      if (e.includes('strikeout'))                       return 'strikes out';
      if (e === 'walk' || e === 'intent walk')           return 'walks';
      if (e === 'hit by pitch')                          return 'hit by pitch';
      if (e === 'grounded into dp')                      return 'grounds into a double play';
      if (e === 'grounded into tp')                      return 'grounds into a triple play';
      if (e === 'sac fly double play')                   return 'hits a sac fly into a double play';
      if (e === 'sac bunt double play')                  return 'bunts into a double play';
      if (e.includes('double play'))                     return 'hits into a double play'; /* mostly line drives */
      if (e.includes('triple play'))                     return 'hits into a triple play';
      if (e.includes('groundout') || e === 'ground out') return 'grounds out';
      if (e.includes('flyout')    || e === 'fly out')    return 'flies out';
      if (e.includes('lineout')   || e === 'line out')   return 'lines out';
      if (e.includes('pop out')   || e.includes('popout')) return 'pops out';
      if (e.includes('sac fly'))                         return 'hits a sac fly';
      if (e.includes('sac bunt'))                        return 'lays down a sac bunt';
      if (e.includes('fielders choice out'))             return 'hits into a fielder\'s choice';
      if (e.includes('fielders choice'))                 return 'reaches on fielder\'s choice';
      if (e === 'forceout' || e === 'force out')         return 'hits into a force out';
      if (e === 'field error')                           return 'reaches on an error';
      if (e === 'catcher interference')                  return 'reaches on catcher interference';
      return event;
    };

    /* Plays that retire a runner while someone else is batting. */
    const runnerOutPhrase = event => {
      const [, kind, base] = /^(pickoff caught stealing|caught stealing|pickoff|runner out)\s*(\S*)/i.exec(event) ?? [];
      if (!kind) return null;
      const at = { '1b': '1st', '2b': '2nd', '3b': '3rd', home: 'home' }[base.toLowerCase()] ?? '';
      switch (kind.toLowerCase()) {
        case 'pickoff':    return at ? `picked off at ${at}` : 'picked off';
        case 'runner out': return 'out on the bases';
        default:           return `caught stealing ${at}`.trim();
      }
    };

    if (play.about?.isComplete) {
      const event     = play.result?.event ?? '';
      const runners   = play.runners ?? [];
      const runnerOut = runnerOutPhrase(event);

      const scorers = runners
        .filter(r => (r.movement?.end ?? '').toLowerCase() === 'score'
                  && !r.movement?.isOut
                  && r.details?.runner?.id !== currentBatterId)
        .map(r => lastName(r.details?.runner?.fullName ?? ''))
        .filter(Boolean);

      /* isOut is also true when the batter is safe but a runner is thrown out,
         which shouldn't read "singles to end the inning". */
      const recordsOut  = !!play.result?.isOut;
      const batterSafe  = ['single', 'double', 'triple', 'field error'].includes(event.toLowerCase());
      const playOuts    = play.count?.outs ?? outs;
      const inningEnded = recordsOut && !batterSafe && playOuts === 3;

      const subject = runnerOut
        ? lastName(runners.find(r => r.movement?.isOut)?.details?.runner?.fullName ?? '')
        : batterLast;
      const label  = [subject, runnerOut ?? eventPhrase(event)].filter(Boolean).join(' ')
                   + (inningEnded ? ' to end the inning' : '');
      const extras = [];
      if (scorers.length) extras.push(scorers.map(s => `${s} scores`).join(', '));
      if (recordsOut && !inningEnded) extras.push(`${playOuts} out${playOuts !== 1 ? 's' : ''}`);
      return label + (extras.length ? ' · ' + extras.join(' · ') : '');
    }

    const lastPitch = [...(play.playEvents ?? [])].reverse().find(e => e.isPitch);
    const pitchDesc = lastPitch?.details?.description ?? '';
    if (!pitchDesc) return '';
    const phrase = pitchPhrase(pitchDesc, play.count);
    if (phrase === 'Ball in play') return phrase;
    return batterLast ? `${batterLast} ${phrase}` : phrase;
  })();
  if (lastPitchDesc) _lastPitchDescCache = lastPitchDesc;
  const displayPitchDesc = lastPitchDesc || _lastPitchDescCache;

  const halfIsTop  = half.toLowerCase().includes('top');
  const halfArrow = halfIsTop ? '▲' : '▼';

  const padresFeedTeam = feed.liveData?.boxscore?.teams?.[padresSide];
  const oppFeedTeam    = feed.liveData?.boxscore?.teams?.[oppSide];
  const padresLineup = getLineup(padresFeedTeam);
  const oppLineup    = getLineup(oppFeedTeam);

  const padresPitcher = getActivePitcherInfo(padresFeedTeam);
  const oppPitcher    = getActivePitcherInfo(oppFeedTeam);
  const padresPitcherLast = lastName(padresPitcher.name);
  const oppPitcherLast    = lastName(oppPitcher.name);
  const padresPitchCount  = padresPitcher.count;
  const oppPitchCount     = oppPitcher.count;

  const lineupHTML = (lineup, side) => {
    const isBatting = halfIsTop ? side === 'away' : side === 'home';
    const isRight   = side === oppSide;
    return lineup.map(p => {
      const isCurrent = isBatting && p.id === currentBatterId && !isWarmup;
      const subMark = p.isSub ? '<span class="sub-mark">↑</span>' : '';
      const posStr  = `<span class="pos-tag">${p.pos}</span>`;
      const inner = isRight
        ? `${posStr} ${subMark}${p.last}<span class="order-num">${p.num}.</span>`
        : `<span class="order-num">${p.num}.</span>${p.last}${subMark}${posStr}`;
      return `<li class="${isCurrent ? 'current-batter' : ''}">${inner}</li>`;
    }).join('');
  };

  const statusBlock = isWarmup
    ? `<div class="gp-warmup-badge">⚾ Warming Up</div>
       <div class="gp-inning-block">
         <div class="gp-inning-num">Pre-Game</div>
         <div class="gp-inning-word">First Pitch Soon</div>
       </div>`
    : '<div class="gp-live-badge"><span class="live-dot"></span> Live</div>';

  const inningBlock = isWarmup ? '' : `
    <div class="gp-inning-block-mid">
      <div class="gp-half-arrow-sm">${halfArrow}</div>
      <div class="gp-inning-big">${inning}${ordinalSuffix(inning)}</div>
      <div class="gp-count-big">${batterCount || '0-0'}</div>
      ${displayPitchDesc ? `<div class="gp-last-pitch">${displayPitchDesc}</div>` : ''}
      <div class="gp-thread-link"><a href="${GAME_THREAD_URL}" target="_blank" rel="noopener">Game Thread ↗</a></div>
    </div>`;

  /* Trim 3-letter abbrs to 2 for score display (CHC→CH, LAD→LA) */
  const padresScoreAbbr = 'SD';
  const oppScoreAbbr = oppAbbr.length >= 3 ? oppAbbr.slice(0, -1) : oppAbbr;

  $.gamePanel.innerHTML = `${CORNERS_HTML}
    <div class="gp-body">
      <div class="gp-left">
        <div class="gp-lineup-name padres">${padresShortName}</div>
        <ul class="gp-lineup">${lineupHTML(padresLineup, padresSide)}</ul>
        <div class="gp-pitcher-footer">
          <div class="gp-pitcher-name"><span class="pos-tag">P </span>${padresPitcherLast}</div>
          ${padresPitchCount != null ? `<div class="gp-pitcher-stat">${padresPitchCount} pitches</div>` : ''}
        </div>
      </div>
      <div class="gp-mid">
        ${statusBlock}
        <div class="gp-diamond">${diamondSVG(onFirst, onSecond, onThird)}</div>
        <div class="gp-outs-col">
          <div class="gp-outs-label">Outs</div>
          <div class="outs-pips">
            <div class="out-pip ${outs >= 1 ? 'on' : ''}"></div>
            <div class="out-pip ${outs >= 2 ? 'on' : ''}"></div>
            <div class="out-pip ${outs >= 3 ? 'on' : ''}"></div>
          </div>
        </div>
        <div class="gp-center-score">
          <span class="gp-center-team padres">${padresScoreAbbr}</span>
          <span class="gp-center-runs">${padresRuns}</span>
          <span class="gp-center-dash">–</span>
          <span class="gp-center-runs">${oppRuns}</span>
          <span class="gp-center-team opp">${oppScoreAbbr}</span>
        </div>
        ${inningBlock}
      </div>
      <div class="gp-right">
        <div class="gp-lineup-name opp">${oppShortName}</div>
        <ul class="gp-lineup">${lineupHTML(oppLineup, oppSide)}</ul>
        <div class="gp-pitcher-footer">
          <div class="gp-pitcher-name">${oppPitcherLast}<span class="pos-tag"> P</span></div>
          ${oppPitchCount != null ? `<div class="gp-pitcher-stat">${oppPitchCount} pitches</div>` : ''}
        </div>
      </div>
    </div>`;
}

/* The next unplayed game with pitchers/lineups/TV. Looks a few days ahead, and
   in the offseason all the way to the next Opening Day. */
async function fetchNextGame() {
  let upcoming = [];
  for (const daysAhead of [10, 200]) {
    const range = await fetchJSON(`${STATS_API}/schedule?sportId=1&startDate=${getLocalDateStr(0)}&endDate=${getLocalDateStr(daysAhead)}&teamId=${PADRES_ID}&gameType=${GAME_TYPES}&fields=dates,games,gamePk,gameDate,status,abstractGameState`);
    upcoming = (range.dates ?? []).flatMap(d => d.games ?? [])
      .filter(g => g.status.abstractGameState === 'Preview')
      .sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate));
    if (upcoming.length) break;
  }
  if (!upcoming.length) return null;

  const detail = await fetchJSON(`${STATS_API}/schedule?sportId=1&gamePk=${upcoming[0].gamePk}&hydrate=probablePitcher,lineups,broadcasts(all),seriesStatus`);
  const games  = (detail.dates ?? []).flatMap(d => d.games ?? []);
  /* A rescheduled game is listed on both its old and new date. */
  return games.find(g => g.status.abstractGameState === 'Preview') ?? games.at(-1) ?? null;
}

async function renderNextGame() {
  const next = await fetchNextGame();
  if (!next) {
    $.gamePanel.innerHTML = `${CORNERS_HTML}<div class="gp-next"><div class="gp-next-label">No upcoming games found</div></div>`;
    return;
  }

  const homeId = next.teams.home.team.id;
  const awayId = next.teams.away.team.id;
  const homeAbbr = next.teams.home.team.abbreviation || ID_TO_ABBR[homeId] || '???';
  const awayAbbr = next.teams.away.team.abbreviation || ID_TO_ABBR[awayId] || '???';
  const timeStr = formatGameTime(next);
  const dateLbl = new Date(next.gameDate).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  const homeProbable    = next.teams.home.probablePitcher?.fullName ?? null;
  const awayProbable    = next.teams.away.probablePitcher?.fullName ?? null;
  const homeProbableId  = next.teams.home.probablePitcher?.id ?? null;
  const awayProbableId  = next.teams.away.probablePitcher?.id ?? null;

  const padresSide    = homeId === PADRES_ID ? 'home' : 'away';
  const oppId         = padresSide === 'home' ? awayId : homeId;
  const lineupPlayers = padresSide === 'home' ? next.lineups?.homePlayers : next.lineups?.awayPlayers;
  const lineupPosted  = Array.isArray(lineupPlayers) && lineupPlayers.length > 0;

  const seriesGame  = next.seriesGameNumber ?? null;
  const seriesTotal = next.gamesInSeries ?? null;
  const isPostseason = next.gameType !== 'R';
  const padresRec    = next.teams[padresSide].leagueRecord;
  const isOpeningDay = !isPostseason && seriesGame === 1 && padresRec?.wins === 0 && padresRec?.losses === 0;
  const venueName   = next.venue?.name ?? null;

  const tvBroadcasts = [...new Set(
    (next.broadcasts ?? []).filter(b => b.type === 'TV').map(b => {
      if (/padres[.\s]*tv/i.test(b.name)) return 'Padres.TV';
      return b.name;
    })
  )];

  /* Parallel: pitcher season stats + season series record */
  const pitcherStatUrl = id =>
    `${STATS_API}/people/${id}/stats?stats=season&group=pitching&season=${next.season}&sportId=1`;
  const [homeStatsData, awayStatsData, seriesSchedule] = await Promise.all([
    homeProbableId ? fetchJSON(pitcherStatUrl(homeProbableId)).catch(() => null) : Promise.resolve(null),
    awayProbableId ? fetchJSON(pitcherStatUrl(awayProbableId)).catch(() => null) : Promise.resolve(null),
    isPostseason ? null : fetchJSON(`${STATS_API}/schedule?sportId=1&season=${next.season}&teamId=${PADRES_ID}&opponentId=${oppId}&gameType=R&fields=dates,games,gamePk,status,abstractGameState,detailedState,teams,home,away,team,id,score`).catch(() => null),
  ]);

  function pitcherStatStr(data) {
    const stat = data?.stats?.[0]?.splits?.[0]?.stat;
    if (!stat) return null;
    const era = parseFloat(stat.era);
    return `${stat.wins ?? 0}-${stat.losses ?? 0}, ${isFinite(era) ? era.toFixed(2) : '—'} ERA`;
  }

  const homeStatStr = pitcherStatStr(homeStatsData);
  const awayStatStr = pitcherStatStr(awayStatsData);

  let seriesW = 0, seriesL = 0;
  if (seriesSchedule) {
    const played = (seriesSchedule.dates ?? []).flatMap(d => d.games ?? []).filter(wasPlayed);
    /* A suspended game is listed on both its original and resumed date. */
    for (const g of new Map(played.map(g => [g.gamePk, g])).values()) {
      const padresIsHome = g.teams.home.team.id === PADRES_ID;
      const padresRuns = padresIsHome ? (g.teams.home.score ?? 0) : (g.teams.away.score ?? 0);
      const oppRuns    = padresIsHome ? (g.teams.away.score ?? 0) : (g.teams.home.score ?? 0);
      if (padresRuns > oppRuns) seriesW++; else seriesL++;
    }
  }

  /* ── Build HTML blocks ─────────────────────────────────────── */
  const metaParts = [];
  if (isPostseason && next.seriesDescription) metaParts.push(next.seriesDescription);
  if (seriesGame && seriesTotal) metaParts.push(`Game ${seriesGame} of ${seriesTotal}`);
  if (venueName) metaParts.push(venueName);
  const metaLine = metaParts.length
    ? `<div class="gp-next-meta">${metaParts.join(' · ')}</div>` : '';

  const pitcherBlock = (homeProbable || awayProbable) ? (() => {
    const awayName = lastName(awayProbable) || 'TBD';
    const homeName = lastName(homeProbable) || 'TBD';
    const statsLine = (awayStatStr || homeStatStr)
      ? `<div class="gp-next-pitcher-stats">${awayStatStr || '—'} &nbsp;vs&nbsp; ${homeStatStr || '—'}</div>`
      : '';
    return `
      <div class="gp-next-divider"></div>
      <div class="gp-next-pitchers">
        <div class="gp-next-pitcher-label">Probable Starters</div>
        <div class="gp-next-pitcher-matchup">${awayName} vs ${homeName}</div>
        ${statsLine}
      </div>`;
  })() : '';

  const seriesText = isPostseason
    ? next.seriesStatus?.result
    : (seriesW > 0 || seriesL > 0) && `Season series: SD ${seriesW}–${seriesL}`;
  const seriesStr = seriesText ? `<div class="gp-next-series">${seriesText}</div>` : '';

  const broadcastStr = tvBroadcasts.length
    ? `<div class="gp-next-broadcasts">${tvBroadcasts.join(' · ')}</div>` : '';

  const lineupBadge = lineupPosted
    ? `<div class="gp-next-lineup-badge">✓ Lineup Posted</div>` : '';

  $.gamePanel.innerHTML = `${CORNERS_HTML}
    <div class="gp-next">
      <div class="gp-next-label">${isOpeningDay ? 'Opening Day' : 'Next Game'}</div>
      ${metaLine}
      <div class="gp-next-teams">${awayAbbr} @ ${homeAbbr}</div>
      <div class="gp-next-time">${timeStr}</div>
      <div class="gp-next-date">${dateLbl}</div>
      ${pitcherBlock}
      ${seriesStr}
      ${broadcastStr}
      ${lineupBadge}
    </div>`;
}

/* ── Refresh loop ─────────────────────────────────────────────────
   One light schedule request (yesterday + today) drives everything that
   changes with game state: the game panel, promo cards and highlights
   buttons. The loop always reschedules itself, so a page opened before
   first pitch goes live on its own, and picks up the final and the
   midnight date change without a reload. */
let _refreshTimer = null;
let _refreshing   = false;
let _panelKey     = null; /* what the game panel currently shows */
let _lastPitchDescCache = '';

/* A game that was actually finished (MLB marks postponed games "Final" too). */
function wasPlayed(g) {
  return g.status.abstractGameState === 'Final'
      && !/postponed|cancel/i.test(g.status.detailedState ?? '');
}

function isSuspended(g) {
  return /suspended/i.test(g.status.detailedState ?? '');
}

function isInProgress(g) {
  return g.status.abstractGameState === 'Live' && !isSuspended(g);
}

/* Today's live game, or yesterday's if it has run past midnight PT. */
function findLiveGame(todayGames, yesterdayGames) {
  return todayGames.find(g => g.status.abstractGameState === 'Live')
      ?? yesterdayGames.find(isInProgress);
}

function nextRefreshDelay(todayGames, liveGame) {
  if (liveGame) return GAME_POLL_MS;
  const starts = todayGames
    .filter(g => g.status.abstractGameState === 'Preview' && !g.status.startTimeTBD) /* TBD times are placeholders */
    .map(g => new Date(g.gameDate).getTime());
  if (!starts.length) return IDLE_POLL_MS;
  const untilPregame = Math.min(...starts) - Date.now() - PREGAME_WINDOW_MS;
  return Math.min(Math.max(untilPregame, PREGAME_POLL_MS), IDLE_POLL_MS);
}

async function renderGamePanel(todayStr, todayGames, liveGame) {
  let key;
  if (liveGame) {
    key = `live|${liveGame.gamePk}`;
    await renderLiveGame(liveGame);
  } else {
    /* Redraw when the day or a game's state changes, plus every so often so
       newly announced pitchers and lineups show up. */
    const ttl = todayGames.length ? 10 * 60_000 : 60 * 60_000;
    key = ['next', todayStr, Math.floor(Date.now() / ttl),
           ...todayGames.map(g => `${g.gamePk}:${g.status.detailedState}`)].join('|');
    if (key === _panelKey) return;
    _lastPitchDescCache = '';
    await renderNextGame();
  }
  const isFirstRender = _panelKey === null; /* init() locks heights once both panels are in */
  const changed = key !== _panelKey;
  _panelKey = key;
  if (changed && !isFirstRender) lockPanelHeights();
}

/* Redraws whatever changed and returns the delay until the next refresh. */
async function refreshPadres() {
  const todayStr     = getLocalDateStr(0);
  const yesterdayStr = getLocalDateStr(-1);
  $.headerDate.textContent = formatDisplayDate(todayStr);

  const sched = await fetchJSON(`${STATS_API}/schedule?sportId=1&startDate=${yesterdayStr}&endDate=${todayStr}&teamId=${PADRES_ID}&gameType=${GAME_TYPES}`);
  const gamesOn = date => sched.dates?.find(d => d.date === date)?.games ?? [];
  const todayGames     = gamesOn(todayStr);
  const yesterdayGames = gamesOn(yesterdayStr);
  const liveGame = findLiveGame(todayGames, yesterdayGames);

  setHighlightsGame('today', todayGames);
  setHighlightsGame('yesterday', yesterdayGames);
  await Promise.all([
    renderPromos(yesterdayStr, yesterdayGames),
    renderGamePanel(todayStr, todayGames, liveGame),
  ]);

  return nextRefreshDelay(todayGames, liveGame);
}

async function runRefreshLoop() {
  if (_refreshing) return;
  _refreshing = true;
  clearTimeout(_refreshTimer);
  let delay = PREGAME_POLL_MS; /* retry delay if this refresh fails */
  try {
    delay = await refreshPadres();
  } catch (err) {
    console.error('Refresh failed:', err);
    /* Keep the last good content on screen; only show errors on first load. */
    if (_panelKey === null) $.gamePanel.innerHTML = `${CORNERS_HTML}<div class="panel-error">Error: ${err.message}</div>`;
    if (_promoKey === null) renderAllCards(() => ({ status: 'error' }));
  } finally {
    _refreshing = false;
  }
  /* Hidden tabs skip the refresh; visibilitychange restarts the loop. */
  _refreshTimer = setTimeout(() => {
    if (document.visibilityState !== 'hidden') runRefreshLoop();
  }, delay);
}

/* Standings have their own, slower loop: every 30s while a division game is on
   or about to start, every few minutes otherwise on a game day and after a late
   game (the table can lag a final), and only at the date change when nobody plays. */
let _standingsTimer = null;
let _standingsDue   = 0;  /* when the table next needs a refresh */
let _standingsDate  = ''; /* the date it was drawn for */

async function refreshStandings() {
  if (!$.standingsBody) return; /* stats panel is open; closing it refreshes */
  const todayStr = getLocalDateStr(0);
  const newDay   = _standingsDate && _standingsDate !== todayStr;
  let delay = STANDINGS_POLL_MS; /* retry delay if this refresh fails */
  try {
    const { yesterday, today } = await fetchNLWest();
    /* A game can run past midnight PT into a day when nobody plays. */
    const liveGame = [...today, ...yesterday].find(isInProgress);
    const justEnded = yesterday.some(g => Date.now() - new Date(g.gameDate) < LATE_GAME_MS);
    delay = today.length || liveGame || justEnded
      ? Math.max(STANDINGS_POLL_MS, nextRefreshDelay(today, liveGame))
      : Infinity;
    _standingsDate = todayStr;
    if (newDay) lockPanelHeights(); /* a doubleheader makes rows taller */
  } catch (err) {
    console.error('Standings refresh failed:', err);
    /* Keep the last good table on screen. */
    if ($.standingsBody && !$.standingsBody.querySelector('[data-team-id]')) {
      $.standingsBody.innerHTML = `<tr><td colspan="8" class="cell-error">Error loading standings: ${err.message}</td></tr>`;
    }
  }
  _standingsDue = Date.now() + delay;
}

async function runStandingsLoop({ force = false } = {}) {
  const isDue = force || Date.now() >= _standingsDue || getLocalDateStr(0) !== _standingsDate;
  if (isDue && document.visibilityState !== 'hidden') await refreshStandings();
  clearTimeout(_standingsTimer); /* after the await, so overlapping calls leave one timer */
  const untilDue = _standingsDue - Date.now();
  _standingsTimer = setTimeout(runStandingsLoop, Math.min(Math.max(untilDue, STANDINGS_POLL_MS), IDLE_POLL_MS));
}

/* When the tab becomes visible again, do an immediate refresh so we're
   not staring at stale data while we wait for the next tick. */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  runStandingsLoop({ force: true });
  runRefreshLoop();
});

/* ── Panel height locking ─────────────────────────────────────── */
/* Match game-panel height to standings-panel height (re-runs on resize). */
let _resizeTimer = null;
function lockPanelHeights() {
  if (!$.nlwestPanel || !$.gamePanel) return;
  /* The stats view manages its own height, also while it slides closed */
  if ($.nlwestPanel.classList.contains('stats-open') || _statsClosing) return;
  /* Reset before measuring so we measure natural content height */
  $.nlwestPanel.style.height = '';
  $.gamePanel.style.height = '';
  const standH = $.nlwestPanel.getBoundingClientRect().height;
  const gameH  = $.gamePanel.getBoundingClientRect().height;
  const h = Math.max(standH, gameH);
  if (h > 0) {
    $.nlwestPanel.style.height    = h + 'px';
    $.nlwestPanel.style.overflowY = 'auto';
    $.gamePanel.style.height      = h + 'px';
    $.gamePanel.style.overflowY   = 'auto';
  }
}
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(lockPanelHeights, 150);
});
/* Web fonts can arrive after the first measurement. */
document.fonts.addEventListener('loadingdone', () => {
  if (_panelKey !== null) lockPanelHeights();
});

/* ── Highlights ───────────────────────────────────────────────────
   Uses MLB's own recap video, looked up by gamePk, so the clip always
   belongs to the exact game being shown. */
function slideDown(el, ms = 380) {
  return new Promise(resolve => {
    el.style.overflow = 'hidden'; el.style.transition = 'none'; el.style.height = '0px';
    el.getBoundingClientRect();
    el.style.transition = `height ${ms}ms ease`; el.style.height = el.scrollHeight + 'px';
    const cleanup = () => { el.style.transition = ''; el.style.height = ''; el.style.overflow = ''; resolve(); };
    el.addEventListener('transitionend', function h(e) { if (e.propertyName !== 'height') return; el.removeEventListener('transitionend', h); cleanup(); });
    setTimeout(cleanup, ms + 100);
  });
}

function slideUp(el, ms = 380) {
  return new Promise(resolve => {
    el.style.overflow = 'hidden'; el.style.transition = 'none'; el.style.height = el.getBoundingClientRect().height + 'px';
    el.getBoundingClientRect();
    el.style.transition = `height ${ms}ms ease`; el.style.height = '0px';
    const cleanup = () => { el.style.transition = ''; el.style.height = ''; el.style.overflow = ''; resolve(); };
    el.addEventListener('transitionend', function h(e) { if (e.propertyName !== 'height') return; el.removeEventListener('transitionend', h); cleanup(); });
    setTimeout(cleanup, ms + 100);
  });
}

function animateBtnText(btn, newText, ms = 220) {
  const fromW = btn.getBoundingClientRect().width;
  if (!fromW) { btn.textContent = newText; return; }
  btn.textContent = newText;
  btn.style.transition = 'none';
  btn.style.width = 'max-content';
  btn.getBoundingClientRect();
  const toW = btn.getBoundingClientRect().width;
  btn.style.width = fromW + 'px';
  btn.getBoundingClientRect();
  btn.style.transition = `width ${ms}ms ease, background 0.15s, color 0.15s`;
  btn.style.width = toW + 'px';
  const cleanup = () => { btn.style.transition = ''; btn.style.width = ''; };
  btn.addEventListener('transitionend', function h(e) {
    if (e.propertyName !== 'width') return;
    btn.removeEventListener('transitionend', h);
    cleanup();
  });
  setTimeout(cleanup, ms + 100);
}

const HIGHLIGHTS = {
  today:     { btn: $.highlightsBtn,          label: '▶ Highlights from Today\'s Game',     gamePk: null },
  yesterday: { btn: $.highlightsYesterdayBtn, label: '▶ Highlights from Yesterday\'s Game', gamePk: null },
};
let _highlightsActive = null; // 'today' | 'yesterday' | null
let _highlightsBusy   = false;

/* Returns the recap's mp4 URL, or null if MLB hasn't posted one. */
async function fetchRecapUrl(gamePk) {
  const data  = await fetchJSON(`${STATS_API}/game/${gamePk}/content`);
  const items = data.highlights?.highlights?.items ?? [];
  const find  = tag => items.find(i => i.keywordsAll?.some(k => k.value === tag));
  const item  = find('game-recap') ?? find('condensed-game');
  return item?.playbacks?.find(p => p.name === 'mp4Avc')?.url ?? null;
}

function showHighlightsStatus(message, gamePk) {
  $.highlightsContent.innerHTML = `<div class="highlights-status">${message} <a href="https://www.mlb.com/gameday/${gamePk}/final/video" target="_blank" rel="noopener">Videos on MLB.com ↗</a></div>`;
}

async function closeHighlights({ animate }) {
  if (_highlightsActive) {
    const slot = HIGHLIGHTS[_highlightsActive];
    _highlightsActive = null;
    animateBtnText(slot.btn, slot.label);
    if (animate) {
      $.highlightsContent.querySelector('video')?.pause();
      await slideUp($.highlightsContent);
    }
  }
  $.highlightsContent.innerHTML = '';
}

async function toggleHighlights(key) {
  if (_highlightsBusy) return;
  _highlightsBusy = true;
  const slot    = HIGHLIGHTS[key];
  const gamePk  = slot.gamePk;
  const wasOpen = _highlightsActive === key;
  try {
    await closeHighlights({ animate: wasOpen });
    if (wasOpen) return;

    const url = await fetchRecapUrl(gamePk);
    if (slot.gamePk !== gamePk) return; /* day rolled over while loading */
    if (!url) {
      showHighlightsStatus('Highlights not posted yet.', gamePk);
      return;
    }

    const video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.setAttribute('aria-label', slot.label.slice(2));
    video.addEventListener('error', () => {
      if (video.isConnected) showHighlightsStatus('Could not play this video.', gamePk);
    });
    video.src = url;

    const wrap = document.createElement('div');
    wrap.className = 'highlights-embed-wrap';
    wrap.appendChild(video);
    $.highlightsContent.replaceChildren(wrap);

    _highlightsActive = key;
    animateBtnText(slot.btn, '✕ Close Highlights');
    slideDown($.highlightsContent);
  } catch (e) {
    console.error('Highlights fetch failed:', e);
    showHighlightsStatus('Could not load highlights.', gamePk);
  } finally {
    _highlightsBusy = false;
  }
}

/* Point a highlights button at the day's latest finished game, or hide it. */
function setHighlightsGame(key, games) {
  const slot   = HIGHLIGHTS[key];
  const gamePk = games.filter(wasPlayed).at(-1)?.gamePk ?? null;
  if (gamePk === slot.gamePk) return;
  if (_highlightsActive === key) closeHighlights({ animate: false });
  slot.gamePk = gamePk;
  slot.btn.textContent   = slot.label;
  slot.btn.style.display = gamePk ? '' : 'none';
  $.highlightsSection.style.display = Object.values(HIGHLIGHTS).some(s => s.gamePk) ? '' : 'none';
}

for (const [key, slot] of Object.entries(HIGHLIGHTS)) {
  slot.btn.addEventListener('click', () => toggleHighlights(key));
}

/* ── Render orchestration ─────────────────────────────────────── */
let _promoKey = null; /* yesterday's date + game states the cards were drawn from */

async function renderPromos(dateStr, games) {
  const key = [dateStr, ...games.map(g => `${g.gamePk}:${g.status.detailedState}`)].join('|');
  const isRedraw = key === _promoKey;
  if (isRedraw && !games.some(isInProgress)) return; /* a live game's numbers keep changing */
  _promoKey = key;
  try {
    await drawPromos(games);
  } catch (err) {
    console.error('Promo fetch failed:', err);
    if (isRedraw) return; /* keep the last good numbers on screen */
    _promoKey = null; /* retry on the next refresh */
    renderAllCards(() => ({ status: 'error' }));
  }
}

/* A promo needs to be triggered in just one game, so on a doubleheader each card
   shows the game that earned it. */
async function drawPromos(games) {
  const started = games.filter(g => wasPlayed(g) || isInProgress(g));

  /* The promo offers are only known to apply to regular-season games. */
  if (!started.length || started[0].gameType !== 'R') {
    const notPlayed = games[0]?.status.detailedState.split(':')[0].toLowerCase();
    renderAllCards(() => started.length
      ? { status: 'postseason' }
      : { status: 'nogame', reason: notPlayed && `Game ${notPlayed}` });
    $.matchupLine.textContent = '';
    return;
  }

  const results = await Promise.all(started.map(async game => {
    const box = await fetchJSON(`${STATS_API}/game/${game.gamePk}/boxscore?fields=teams,home,away,team,id,name,teamStats,batting,pitching,runs,strikeOuts,stolenBases,homeRuns,batters,pitchers,players,stats`);
    const padresSide = box.teams.home.team.id === PADRES_ID ? 'home' : 'away';
    const oppSide    = padresSide === 'home' ? 'away' : 'home';
    const score = {
      padres: box.teams[padresSide].teamStats?.batting?.runs ?? 0,
      opp:    box.teams[oppSide].teamStats?.batting?.runs ?? 0,
    };
    const isLive = !wasPlayed(game);
    return {
      box, padresSide, score, isLive,
      oppName: box.teams[oppSide].team.name,
      isWin: !isLive && score.padres > score.opp,
      gameNote: started.length > 1 ? ` (Game ${game.gameNumber})` : '',
    };
  }));

  renderAllCards(promo => {
    const states = results.map(r => ({
      ...promo.stat(r.box, r.padresSide, r.isWin),
      status: r.isLive ? 'live' : 'final',
      score: r.score,
      gameNote: r.gameNote,
    }));
    return states.find(s => s.status === 'final' && promo.check(s.value))
        ?? states.find(s => s.status === 'live')
        ?? states.reduce((best, s) => s.value >= best.value ? s : best);
  });

  $.matchupLine.innerHTML = results.map(r => {
    const padres = ['Padres', r.score.padres], opp = [r.oppName, r.score.opp];
    const [away, home] = r.padresSide === 'away' ? [padres, opp] : [opp, padres];
    const live = r.isLive ? '<span class="matchup-live">● LIVE &nbsp;—&nbsp; </span>' : '';
    return `<div>${live}${away[0]} ${away[1]} — ${home[1]} ${home[0]}</div>`;
  }).join('');
}

async function init() {
  $.headerDate.textContent = formatDisplayDate(getLocalDateStr(0));
  renderAllCards(() => ({ status: 'loading' }));

  /* The refresh loop draws the game panel, promos and highlights buttons.
     Both loops keep rescheduling themselves. */
  await Promise.all([runStandingsLoop(), runRefreshLoop()]);

  /* After both panels load, lock both to standingsPanel height */
  requestAnimationFrame(lockPanelHeights);
}
