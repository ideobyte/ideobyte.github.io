/* ── Team stats ─────────────────────────────────────────────────
   Strategy: capture the standings-panel height on first open, then
   pin the panel to a fixed pixel height during the stats view so
   the slide animation has stable from/to values. */

let _standingsH   = 0;     // captured on open
let _statsClosing = false; // panel is sliding back to the standings

function panelSlide(panel, fromH, toH, ms) {
  return new Promise(resolve => {
    // Must override flex:1 or the browser ignores style.height
    panel.style.flex       = 'none';
    panel.style.transition = 'none';
    panel.style.height     = fromH + 'px';
    panel.style.overflow   = 'hidden';
    panel.getBoundingClientRect(); // force reflow
    panel.style.transition = `height ${ms}ms ease`;
    panel.style.height     = toH + 'px';
    function onEnd(e) {
      if (e.propertyName !== 'height') return;
      panel.removeEventListener('transitionend', onEnd);
      panel.style.transition = '';
      resolve();
    }
    panel.addEventListener('transitionend', onEnd);
    setTimeout(resolve, ms + 100);
  });
}

async function openTeamStats(teamId, teamName, isPadres) {
  const session = {};
  _statsTeamId  = teamId;
  _statsTab     = 'hitting';
  _statsData    = session;
  _statsSortCol = 'avg';
  _statsSortDir = 'desc';

  const shortName = teamName.split(' ').pop();
  document.getElementById('standingsLabel').textContent = shortName + ' Stats';

  const panel = document.getElementById('nlwestPanel');

  // Capture standings height before anything changes (mid-close it's still shrinking)
  if (!_statsClosing) _standingsH = panel.getBoundingClientRect().height;
  const targetH = Math.round(_standingsH * 2);

  // Pin height so the slide animation has a starting point
  panel.style.height   = _standingsH + 'px';
  panel.style.overflow = 'hidden';

  // Fade out just the inner content
  const inner = panel.querySelector('table, .stats-header, .gp-next');
  if (inner) await inner.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished;
  if (_statsData !== session) return; // closed, or another team was opened

  // Swap content while invisible
  const hadFocus = panel.contains(document.activeElement);
  panel.innerHTML = `
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="stats-header" style="opacity:0">
      <button class="stats-back-btn" onclick="closeTeamStats()">← Standings</button>
      <div class="stats-team-name ${isPadres ? 'padres' : ''}">${teamName}</div>
      <div class="stats-tabs">
        <button class="stats-tab" id="tabLastGame" onclick="switchStatsTab('lastgame')">Last Game</button>
        <button class="stats-tab active" id="tabHitting"  onclick="switchStatsTab('hitting')">Hitting</button>
        <button class="stats-tab"        id="tabPitching" onclick="switchStatsTab('pitching')">Pitching</button>
      </div>
    </div>
    <div class="stats-table-wrap" id="statsTableWrap" style="opacity:0;height:${targetH - 70}px">
      <div class="stats-loading">Loading stats...</div>
    </div>`;

  panel.classList.add('stats-open');
  if (hadFocus) panel.querySelector('.stats-back-btn').focus({ preventScroll: true });

  // Slide panel height AND fade in content simultaneously
  await Promise.all([
    panelSlide(panel, _standingsH, targetH, 420),
    (async () => {
      await new Promise(r => setTimeout(r, 80)); // slight delay so slide starts first
      const header = panel.querySelector('.stats-header');
      const wrap   = panel.querySelector('.stats-table-wrap');
      if (header) header.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280, fill: 'forwards' });
      if (wrap)   wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280, fill: 'forwards' });
    })(),
  ]);

  if (_statsData !== session) return;

  panel.style.height = targetH + 'px';
  panel.style.flex   = 'none'; // keep flex:none so height stays fixed during stats view

  if (_statsTab === 'hitting') await loadStatsTab(); // else a tab click already loaded it
}

/* Shows the selected tab, fetching it first if needed. A response that arrives
   after the tab, team or panel changed is kept for its own session but not drawn. */
async function loadStatsTab() {
  const session = _statsData, tab = _statsTab, teamId = _statsTeamId;
  const isCurrent = () => session === _statsData && tab === _statsTab;

  if (!session[tab]) {
    showStatsMessage(tab === 'lastgame' ? 'Loading last game...' : 'Loading stats...');
    try {
      session[tab] = tab === 'lastgame' ? await fetchLastGameStats(teamId) : await fetchSeasonStats(teamId, tab);
    } catch (err) {
      console.error('Stats fetch failed:', err);
      if (isCurrent()) showStatsMessage('Could not load stats. <button class="stats-tab" onclick="loadStatsTab()">Retry</button>');
      return;
    }
    if (!isCurrent()) return;
  }

  if (tab === 'lastgame') renderLastGame();
  else renderStatsTable(tab);
}

function showStatsMessage(html) {
  const wrap = document.getElementById('statsTableWrap');
  if (!wrap) return;
  /* Replacing a focused Retry button drops keyboard focus, so move it to the tab. */
  if (wrap.contains(document.activeElement)) document.querySelector('.stats-tab.active')?.focus({ preventScroll: true });
  wrap.innerHTML = `<div class="stats-loading" role="status">${html}</div>`;
  wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' });
}

async function fetchSeasonStats(teamId, group) {
  const data = await fetchJSON(`${STATS_API}/stats?stats=season&group=${group}&season=${_season}&sportId=1&gameType=R&teamId=${teamId}&playerPool=ALL&limit=100`);
  return (data.stats?.[0]?.splits ?? [])
    .filter(s => s.player?.fullName)
    .map(s => ({ name: s.player.fullName, pos: s.position?.abbreviation ?? '', ...s.stat }));
}

function renderStatsTable(tab) {
  const cols = tab === 'hitting' ? HITTING_COLS : PITCHING_COLS;
  let rows   = [...(_statsData[tab] ?? [])];

  if (tab === 'hitting') {
    rows = rows.filter(r => (parseInt(r.plateAppearances) || 0) >= 10);
  } else {
    rows = rows.filter(r => (parseFloat(r.inningsPitched) || 0) >= 10);
  }

  const sortKey = _statsSortCol ?? (tab === 'hitting' ? 'avg' : 'era');
  rows.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (sortKey === 'name') return _statsSortDir === 'asc'
      ? String(av).localeCompare(String(bv))
      : String(bv).localeCompare(String(av));
    const an = parseFloat(av) || 0, bn = parseFloat(bv) || 0;
    return _statsSortDir === 'asc' ? an - bn : bn - an;
  });

  const thead = cols.map(c => {
    const sorted = c.key === sortKey
      ? ` class="sort-${_statsSortDir}" aria-sort="${_statsSortDir}ending"` : '';
    return `<th${sorted} data-key="${c.key}" onclick="sortStats('${c.key}')"><button>${c.label}</button></th>`;
  }).join('');

  const tbody = rows.length
    ? rows.map(r => '<tr>' + cols.map(c => {
        if (c.key === 'name') return `<td>${r.name}<span class="stat-pos">${r.pos}</span></td>`;
        const raw = r[c.key] ?? '—';
        return `<td class="stat-num">${raw !== '—' && c.fmt ? c.fmt(raw) : raw}</td>`;
      }).join('') + '</tr>').join('')
    : `<tr><td colspan="${cols.length}" class="stats-loading">No qualifying players</td></tr>`;

  const wrap = document.getElementById('statsTableWrap');
  if (!wrap) return;

  const session = _statsData;
  wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' }).finished.then(() => {
    if (session !== _statsData || tab !== _statsTab) return; /* switched during the fade */
    /* Redrawing drops keyboard focus, so put it back on the same header. */
    const focusedKey = wrap.contains(document.activeElement) && document.activeElement.closest('th')?.dataset.key;
    wrap.innerHTML = `<table class="stats-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;
    if (focusedKey) wrap.querySelector(`th[data-key="${focusedKey}"] button`)?.focus({ preventScroll: true });
    wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' });
  });
}

function sortStats(key) {
  if (_statsSortCol === key) {
    _statsSortDir = _statsSortDir === 'desc' ? 'asc' : 'desc';
  } else {
    _statsSortCol = key;
    _statsSortDir = (key === 'name' || key === 'era' || key === 'whip') ? 'asc' : 'desc';
  }
  renderStatsTable(_statsTab);
}

async function switchStatsTab(tab) {
  if (tab === _statsTab) return;
  _statsTab     = tab;
  _statsSortCol = tab === 'hitting' ? 'avg' : tab === 'pitching' ? 'era' : null;
  _statsSortDir = tab === 'pitching' ? 'asc' : 'desc';
  document.getElementById('tabLastGame')?.classList.toggle('active', tab === 'lastgame');
  document.getElementById('tabHitting')?.classList.toggle('active',  tab === 'hitting');
  document.getElementById('tabPitching')?.classList.toggle('active', tab === 'pitching');
  await loadStatsTab();
}

async function closeTeamStats() {
  if (_statsTeamId === null) return; // already closing
  const teamId  = _statsTeamId;
  const session = {};
  _statsTeamId  = null;
  _statsData    = session;
  _statsClosing = true;
  document.getElementById('standingsLabel').textContent = 'NL West Standings';

  const panel    = document.getElementById('nlwestPanel');
  const currentH = parseFloat(panel.style.height) || panel.getBoundingClientRect().height;
  const toH      = _standingsH || Math.round(currentH / 2);

  // Fade out content
  const header = panel.querySelector('.stats-header');
  const wrap   = panel.querySelector('.stats-table-wrap');
  const fadeOuts = [];
  if (header) fadeOuts.push(header.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished);
  if (wrap)   fadeOuts.push(wrap.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }).finished);
  await Promise.all(fadeOuts);

  const hadFocus = panel.contains(document.activeElement);

  // Swap HTML — this wipes all inline styles including height
  panel.innerHTML = CORNERS_HTML + STANDINGS_TABLE_HTML;
  const restoredTable = panel.querySelector('table');
  if (restoredTable) restoredTable.style.opacity = '0';

  panel.classList.remove('stats-open');

  // Start fetching the standings data immediately so it's ready in the background
  const standingsPromise = runStandingsLoop({ force: true });

  // Re-lock height immediately after innerHTML wiped it, with no transition
  panel.style.transition = 'none';
  panel.style.height     = currentH + 'px';
  panel.style.overflow   = 'hidden';
  panel.style.flex       = 'none';
  panel.getBoundingClientRect(); // force reflow to commit

  // Now animate to standings height
  panel.style.transition = 'height 420ms ease';
  panel.style.height     = toH + 'px';

  // Fade table in while sliding
  setTimeout(() => {
    const table = panel.querySelector('table');
    if (table) table.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280, fill: 'forwards' });
  }, 80);

  // Wait for the slide animation to finish
  await new Promise(r => setTimeout(r, 470));

  // Wait for the standings data to actually populate the DOM so the height doesn't collapse
  await standingsPromise;

  _statsClosing = false;
  if (_statsData !== session) return; // a team was opened meanwhile

  if (hadFocus && !panel.contains(document.activeElement)) focusStandingsTeam(teamId);

  // Release back to flex
  panel.style.transition = 'none';
  panel.style.height     = '';
  panel.style.overflow   = '';
  panel.style.flex       = '';
  lockPanelHeights(); // the rows or the window may have changed meanwhile
}

/* ── Last Game stats ─────────────────────────────────────────────
   Finds the most recent completed game for the selected team (looking back
   to last season if need be) and fetches its full boxscore, for hitting + pitching tables of both teams. */

async function fetchLastGameStats(teamId) {
  let game;
  for (const daysBack of [10, 200]) {
    const sched = await fetchJSON(`${STATS_API}/schedule?sportId=1&startDate=${getLocalDateStr(-daysBack)}&endDate=${getLocalDateStr(0)}&teamId=${teamId}&gameType=${GAME_TYPES}&fields=dates,games,gamePk,status,abstractGameState,detailedState,teams,home,away,team,id,name`);
    game = (sched.dates ?? []).flatMap(d => d.games ?? []).filter(wasPlayed).at(-1);
    if (game) break;
  }
  if (!game) return { noGame: true };

  const box    = await fetchJSON(`${STATS_API}/game/${game.gamePk}/boxscore`);
  const homeAbbr = box.teams.home.team.abbreviation ?? box.teams.home.team.name.split(' ').pop();
  const awayAbbr = box.teams.away.team.abbreviation ?? box.teams.away.team.name.split(' ').pop();
  const homeR  = box.teams.home.teamStats?.batting?.runs ?? 0;
  const awayR  = box.teams.away.teamStats?.batting?.runs ?? 0;

  /* Everyone who held a lineup spot, starters and substitutes. battingOrder is
     "300" for the starter in the 3 hole, "301" for the first sub, and so on. */
  function buildHitters(side) {
    const { batters = [], players = {} } = box.teams[side];
    return batters
      .map(pid => players[`ID${pid}`])
      .filter(p => p?.battingOrder)
      .sort((a, b) => a.battingOrder - b.battingOrder)
      .map(p => ({
        name: p.person?.fullName ?? '—',
        isSub: p.battingOrder % 100 !== 0,
        ...p.stats?.batting,
      }));
  }

  function buildPitchers(side) {
    const { pitchers = [], players = {} } = box.teams[side];
    return pitchers
      .map(pid => players[`ID${pid}`])
      .filter(Boolean)
      .map(p => ({ name: p.person?.fullName ?? '—', ...p.stats?.pitching }));
  }

  return {
    side:    game.teams.home.team.id === teamId ? 'home' : 'away', /* the team being shown */
    score:   `${awayAbbr} ${awayR} – ${homeR} ${homeAbbr}`,
    home:    { abbr: homeAbbr, name: game.teams.home.team.name, hitters: buildHitters('home'), pitchers: buildPitchers('home') },
    away:    { abbr: awayAbbr, name: game.teams.away.team.name, hitters: buildHitters('away'), pitchers: buildPitchers('away') },
  };
}

function lgStatTable(players, cols, emptyColspan) {
  const thead = cols.map(c => `<th>${c.label}</th>`).join('');
  const rows = players.map(r =>
    '<tr>' + cols.map(c =>
      c.key === 'name'
        ? `<td${r.isSub ? ' class="lg-sub"' : ''}>${r.name}</td>`
        : `<td class="stat-num">${r[c.key] ?? 0}</td>`
    ).join('') + '</tr>'
  ).join('');
  const body = rows || `<tr><td colspan="${emptyColspan}" class="stats-loading">No data</td></tr>`;
  return `<table class="stats-table"><thead><tr>${thead}</tr></thead><tbody>${body}</tbody></table>`;
}

function lgTeamContentHTML(team) {
  return `
    <div class="lg-team-name">${team.name}</div>
    <div class="lg-section-label">Batting</div>
    ${lgStatTable(team.hitters, LAST_GAME_HITTING_COLS, LAST_GAME_HITTING_COLS.length)}
    <div class="lg-section-label">Pitching</div>
    ${lgStatTable(team.pitchers, LAST_GAME_PITCHING_COLS, LAST_GAME_PITCHING_COLS.length)}`;

function renderLastGame() {
  const data = _statsData.lastgame;

    return;

  wrap.innerHTML = `

    <div class="lg-team-picker">
      <button class="lg-team-btn ${data.side === 'away' ? 'active' : ''}"
        onclick="selectLgSide('away')">${data.away.abbr}</button>

        onclick="selectLgSide('home')">${data.home.abbr}</button>
    </div>
    <div id="lgTeamContent">${lgTeamContentHTML(data[data.side])}</div>`;

  wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' });

function selectLgSide(side) {
  const data = _statsData.lastgame;
  if (!data || side === data.side) return;
  data.side = side;

  document.querySelectorAll('.lg-team-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.trim() === data[side].abbr);
  });

  const content = document.getElementById('lgTeamContent');
  if (!content) return;

  content.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 150, fill: 'forwards' }).finished.then(() => {
    content.innerHTML = lgTeamContentHTML(data[side]);
    content.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' });
  });
}

/* ── Easter egg: type "wilmyers" anywhere to trigger ──────────── */
(() => {
  const SECRET = 'wilmyers';
  const SECRET_LEN = SECRET.length;
  let buffer = '';

  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    /* Single-char keys only — ignore Shift, Meta, ArrowLeft, etc. */
    if (e.key.length !== 1) return;

    buffer = (buffer + e.key.toLowerCase()).slice(-SECRET_LEN);
    if (buffer === SECRET) {
      buffer = '';
      triggerWilmyers();
    }
  });

  function triggerWilmyers() {
    if (document.getElementById('wilmyers-overlay')) return;

    const overlay = document.createElement('div');
    overlay.id = 'wilmyers-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;opacity:0;transition:opacity 2s ease;cursor:pointer';

    const video = document.createElement('video');
    video.src = '/data/wilmyers.mp4';
    video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
    video.volume = 0;
    video.autoplay = true;
    video.playsInline = true;

    overlay.appendChild(video);
    document.body.appendChild(overlay);

    /* Ramp the volume to a level over 2s, replacing any ramp already running. */
    let ramp = null;
    const rampVolume = to => {
      clearInterval(ramp);
      const from = video.volume, steps = 40;
      let step = 0;
      ramp = setInterval(() => {
        video.volume = from + (to - from) * (++step / steps);
        if (step >= steps) clearInterval(ramp);
      }, 2000 / steps);
    };

    /* Fade overlay in + ramp audio up over 2s */
    let closing = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (closing) return;
      overlay.style.opacity = '1';
      rampVolume(1);
    }));

    const fadeOut = () => {
      closing = true;
      video.removeEventListener('ended', fadeOut);
      overlay.removeEventListener('click', fadeOut);

      rampVolume(0);
      overlay.style.opacity = '0';
      setTimeout(() => { video.pause(); overlay.remove(); }, 2000);
    };

    video.addEventListener('ended', fadeOut);
    overlay.addEventListener('click', fadeOut);
  }
})();
</script>
